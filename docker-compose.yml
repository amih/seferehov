services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: seferehov
      POSTGRES_USER: seferehov
      POSTGRES_PASSWORD: ${PGPASSWORD:-seferehov}
    ports:
      - "127.0.0.1:${PGPORT:-5470}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  search:
    # SearXNG: the web search that checks a spine's reading (server/src/websearch.js).
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me}
    ports:
      - "127.0.0.1:${SEARCH_PORT:-8895}:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
volumes:
  pgdata:

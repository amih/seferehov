# /etc/nginx/sites-available/<host>.conf — replace HOST and APP_DIR.
# Enable as sites-enabled/<host>.conf (the include matches *.conf only).
# Certificates: sudo certbot certonly --webroot -w /var/www/acme --cert-name HOST -d HOST -d www.HOST
# (certbot's installer can't parse this file, so TLS is written out here.)
upstream seferehov_api {
    server 127.0.0.1:3870;
    keepalive 16;
}

server {
    server_name HOST;
    root APP_DIR/web/dist;
    client_max_body_size 20M;

    # Content-hashed files never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything that decides which version runs must always be revalidated.
    location = /sw.js               { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /version.json        { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } try_files $uri =404; }

    # Uploaded photos have unique names.
    location /uploads/ {
        alias APP_DIR/uploads/;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
    }

    # Shelf videos (and admin test uploads) can be large; everything else stays at 20M.
    location ~ ^/api/(locations/[^/]+/scans|admin/traces)$ {
        client_max_body_size 110M;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://seferehov_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://seferehov_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App routes (/l/ABC123, /add, …) → index.html, never cached.
    # Files of the web build; every other page goes to the app server, which returns
    # index.html with the page's title and content for search engines (server/src/seo.js).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri @app;
    }
    location @app {
        proxy_pass http://seferehov_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HOST/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name www.HOST;
    return 301 https://HOST$request_uri;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HOST/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name HOST www.HOST;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
